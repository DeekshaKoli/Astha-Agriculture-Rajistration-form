<!DOCTYPE html>

<html>
<head>
<title>Astha Agriculture</title>

<style>

/* BODY */
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: Arial;
    background: linear-gradient(135deg,#2c3e50,#4ca1af);
}

/* MAIN BOX */
.box{
    background:white;
    padding:40px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,0.2);
    width:300px;
}

/* TITLE */
h1{
    margin-bottom:20px;
    color:#2c3e50;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
}

/* STUDENT BUTTON */
.student{
    background:#27ae60;
    color:white;
}

.student:hover{
    background:#219150;
}

/* ADMIN BUTTON */
.admin{
    background:#e67e22;
    color:white;
}

.admin:hover{
    background:#ca6f1e;
}

/* MOBILE */
@media(max-width:400px){
    .box{
        width:90%;
        padding:25px;
    }
}

</style>

</head>

<body>

<div class="box">

<h1>🌾 ASTHA AGRICULTURE</h1>

<button class="student" onclick="goStudent()">Student Registration</button>

<button class="admin" onclick="goAdmin()">Admin Login</button>

</div>

<script>

// Student page
function goStudent(){
    window.location.href = "form.html";
}

// Admin login page
function goAdmin(){
    window.location.href = "login.html";
}

</script>

</body>
</html>
